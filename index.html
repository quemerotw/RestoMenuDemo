<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Resto</title>
    <script src="https://kit.fontawesome.com/80df01cda2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
        <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MG4ZTQQL"
                height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!-- Header -->
    <header>
        <div class="logo">
            <img id="logoPipina" src="images/logo.png" alt="">
            <p>RestoFan</p>
        </div>
        <nav id="navbar">
            <ul id="navList">
            </ul>
        </nav>
        <div class="buttons-container">
            <div class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-list"></i></div>
            <div class="cart-button" onclick="carrito.toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-badge" class="cart-badge">0</span>
            </div>
        </div>
    </header>

    <div id="cart-overlay" class="cart-overlay"></div>

    <div id="cart-panel" class="cart-panel">
        <div class="cart-header">
            <h2>Mi Carrito</h2>
            <button id="close-cart" class="close-cart">✖</button>
        </div>

        <div class="cart-body">
            <div id="empty-cart-message" class="empty-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <p>Tu carrito está vacío</p>
            </div>
            <div id="cart-items" class="cart-items"></div>
        </div>

        <div id="cart-footer" class="cart-footer">
            <div class="cart-total-section">
                <span>Total:</span>
                <span id="cart-total" class="cart-total-amount">$0</span>
            </div>
            <button class="btn-vaciar" onclick="carrito.vaciarCarrito()">
                Vaciar Carrito
            </button>
            <button class="btn-finalizar" onclick="carrito.finalizarCompra()">
                <i class="fa-brands fa-whatsapp"></i>
                Finalizar Pedido
            </button>
        </div>
    </div>

    <main>
        <a id="whatsappOverlay" href="" target="_blank">hace tu pedido<i id="wapp" class="fa-brands fa-whatsapp"></i></a>
        <section id="splash">
        </section>
        <div id="page">

        </div>


    </main>
    <section id="nosotros" class="nosotros"></section>

    <footer>
        <p>© 2026 - Página creada por [Agustin Coronel]</p>
        <a href="https://quemerotw.github.io/Portfolio/">Portfolio</a>
    </footer>

    <script src="main.js"></script>
</body>
</html>
